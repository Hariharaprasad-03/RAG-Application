spring.application.name=demo
server.port=8080
server.servlet.context-path=/chatModel

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Google Gemini API configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash

# ==========================================
# 1. Spring Cloud AWS Configuration
# ==========================================
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# ==========================================
# 3. AWS Bedrock Knowledge Base Custom Props
# ==========================================
aws.bedrock.knowledge-base-id=${BEDROCK_KB_ID:}
aws.bedrock.top-k=3
aws.s3.bucket-name=amzn-fst-rag-knowlwdgebase
aws.bedrock.data-source-id=${BEDROCK_DATA_SOURCE_ID: }